name: Deploy Browser Analytics

# Separate from SWA hosting: analytics changes must not redeploy the website resource.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'infra/analytics/**'
      - '.github/workflows/deploy-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'infra/analytics/**'
      - '.github/workflows/deploy-analytics.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: browser-analytics-${{ github.ref }}
  cancel-in-progress: false

env:
  ANALYTICS_SUBSCRIPTION_ID: 'bb732a02-2579-488d-8337-a159f8b1c0a9'
  ANALYTICS_RESOURCE_GROUP: 'rg-kennethheine.com'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment subscription
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = "$ANALYTICS_SUBSCRIPTION_ID"

      - name: Validate analytics template
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/analytics/main.bicep --stdout > "$RUNNER_TEMP/analytics.json"
          az deployment group validate \
            --subscription "$ANALYTICS_SUBSCRIPTION_ID" \
            --resource-group "$ANALYTICS_RESOURCE_GROUP" \
            --template-file "$RUNNER_TEMP/analytics.json" \
            --only-show-errors --output none

      - name: What-if (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          echo '## Browser analytics infrastructure what-if' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          az deployment group what-if \
            --subscription "$ANALYTICS_SUBSCRIPTION_ID" \
            --resource-group "$ANALYTICS_RESOURCE_GROUP" \
            --template-file "$RUNNER_TEMP/analytics.json" \
            --name "analytics-whatif-${GITHUB_RUN_ID}" \
            --only-show-errors 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy analytics
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --subscription "$ANALYTICS_SUBSCRIPTION_ID" \
            --resource-group "$ANALYTICS_RESOURCE_GROUP" \
            --template-file "$RUNNER_TEMP/analytics.json" \
            --name "analytics-${GITHUB_RUN_ID}" \
            --only-show-errors \
            --query properties.outputs --output json > "$RUNNER_TEMP/analytics-outputs.json"
          {
            echo '## Browser analytics provisioned'
            echo '```json'
            cat "$RUNNER_TEMP/analytics-outputs.json"
            echo '```'
            echo 'The connection string is a public browser ingestion identifier, not a telemetry read credential.'
          } >> "$GITHUB_STEP_SUMMARY"
