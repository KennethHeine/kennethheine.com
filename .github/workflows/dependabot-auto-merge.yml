name: Dependabot Auto-Merge

on:
  workflow_run:
    # The PR build/test/deploy now runs through the reusable workflow caller named
    # "Deploy Web App" (formerly the separate "Deploy Preview Environment").
    workflows: ['Deploy Web App']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Get PR info from workflow run
        id: pr-info
        uses: actions/github-script@v9
        with:
          script: |
            // Get the PR associated with the workflow run
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });

            let prNumber = workflowRun.pull_requests?.[0]?.number;
            if (!prNumber) {
              // Fallback: search for PR by head branch
              const { data: searchPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
                state: 'open'
              });
              
              if (searchPrs.length === 0) {
                core.setFailed('No open PR found for this workflow run');
                return;
              }
              
              prNumber = searchPrs[0].number;
            }

            const { data: prDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // A completed run may belong to a closed PR or an older revision.
            if (
              prDetails.state !== 'open' ||
              prDetails.user.login !== 'dependabot[bot]' ||
              prDetails.base.ref !== 'main' ||
              prDetails.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              prDetails.head.sha !== workflowRun.head_sha
            ) {
              core.info('Skipping: the run does not match the current open Dependabot PR head.');
              return;
            }

            core.setOutput('pr-number', prDetails.number);
            core.setOutput('pr-title', prDetails.title);

      - name: Enable auto-merge for Dependabot PRs
        if: steps.pr-info.outputs.pr-number != ''
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_NUMBER" --repo "$GH_REPO"
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr-number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.pr-info.outputs.pr-number != ''
        env:
          PR_TITLE: ${{ steps.pr-info.outputs.pr-title }}
        run: |
          echo "## 🤖 Dependabot Auto-Merge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          printf '**PR:** %s\n' "$PR_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Auto-merge enabled with squash strategy." >> $GITHUB_STEP_SUMMARY
